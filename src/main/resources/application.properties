spring.application.name=roadguard
server.port=${PORT:8080}
# Never put exception text on the default error page; the API returns its own JSON errors.
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Session cookie (server-side login session) ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when the site is served over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Behind an HTTPS reverse proxy set FORWARD_HEADERS_STRATEGY=framework so the app sees the original scheme and client address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---- H2 database (file-based, so data survives restarts) ----
# For a throwaway in-memory DB instead, use: jdbc:h2:mem:roadguard;DB_CLOSE_DELAY=-1
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/roadguard}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# "update" only ADDS tables/columns/indexes; it never drops or rewrites existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# H2 web console (off by default: it exposes the whole database). Enable with H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ---- Photo uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
roadguard.upload.dir=${UPLOAD_DIR:./data/uploads}
roadguard.upload.max-bytes=5242880

# ---- Map tiles (browser). Any XYZ tile server works; keep the attribution required by its licence. ----
roadguard.map.tile-url=${MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
roadguard.map.attribution=${MAP_ATTRIBUTION:&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors}
roadguard.map.center-lat=19.0760
roadguard.map.center-lng=72.8777
roadguard.map.zoom=11

# ---- Routing (OSRM-compatible). The public demo server is for light use; self-host OSRM for real traffic. No key needed. ----
roadguard.routing.base-url=${ROUTING_BASE_URL:https://router.project-osrm.org}
roadguard.routing.profile=driving
roadguard.routing.timeout-ms=8000
roadguard.routing.max-alternatives=3

# ---- Place search (Nominatim-compatible). Identify your app; add a contact e-mail per the Nominatim usage policy. ----
roadguard.user-agent=${HTTP_USER_AGENT:RoadGuard-CollegeProject/1.0}
roadguard.geocoding.base-url=${GEOCODER_BASE_URL:https://nominatim.openstreetmap.org}
roadguard.geocoding.contact-email=${GEOCODER_CONTACT_EMAIL:}
roadguard.geocoding.country-codes=in

# ---- Route safety scoring model (see RouteSafetyService for how these are used) ----
roadguard.scoring.low-penalty=2
roadguard.scoring.medium-penalty=5
roadguard.scoring.high-penalty=10
roadguard.scoring.near-meters=20
roadguard.scoring.buffer-meters=60
roadguard.scoring.edge-factor=0.5
roadguard.scoring.in-progress-factor=0.75
roadguard.scoring.duplicate-meters=15
roadguard.scoring.safe-min-score=80
roadguard.scoring.moderate-min-score=50

# ---- Charts are bucketed in this time zone ----
roadguard.time-zone=${ROADGUARD_TIMEZONE:Asia/Kolkata}

# ---- Demo accounts and sample records (all sample rows are flagged SAMPLE). Set SEED_ENABLED=false for a clean database. ----
roadguard.seed.enabled=${SEED_ENABLED:true}
roadguard.seed.demo-user-email=demo@roadguard.app
roadguard.seed.demo-user-password=${SEED_DEMO_PASSWORD:password123}
roadguard.seed.admin-email=admin@roadguard.app
roadguard.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}

# ---- First administrator for a real deployment (leave empty to skip). Use together with SEED_ENABLED=false. ----
roadguard.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
roadguard.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---- SEO and site identity (see SpaFilter and SeoController) ----
# Public address of the site, used for canonical links, the sitemap and social previews. Set SITE_URL on the live server.
roadguard.seo.site-url=${SITE_URL:http://localhost:8080}
# Google Analytics 4 Measurement ID (G-XXXXXXXXXX). Leave empty to disable tracking.
roadguard.seo.google-analytics-id=${GA_MEASUREMENT_ID:}
# Google Search Console HTML-tag verification value (the content of the meta tag Google gives you).
roadguard.seo.search-console-verification=${SEARCH_CONSOLE_VERIFICATION:}
# Legacy URLs that moved: "/old=/new;/other=/target". Each gets a permanent 301 redirect.
roadguard.seo.redirects=${SEO_REDIRECTS:}
